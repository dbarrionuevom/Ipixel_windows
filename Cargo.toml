[package]
name = "ipixel_windows"
version = "0.1.2"
edition = "2021"

[dependencies]
btleplug = "0.11"
crc32fast = "1.4"
eframe = "0.31"
futures = "0.3"
gif = "0.13"
image = { version = "0.25", features = ["gif", "png", "jpeg", "bmp", "webp"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ureq = "2"
uuid = "1.11"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
